name: Styx Code Review

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Cancel previous run on new push
concurrency:
  group: styx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: "!contains(github.event.head_commit.message, 'Styx:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download Styx
        run: |
          curl -L -o /tmp/styx https://styx-44p.pages.dev/styx-linux-amd64
          chmod +x /tmp/styx

      - name: Run Styx
        env:
          STYX_API_ENDPOINT: ${{ secrets.STYX_API_ENDPOINT }}
          STYX_API_KEY: ${{ secrets.STYX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /tmp/styx --run styx.yaml

      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(git branch -r --list 'origin/styx/*' | head -1 | sed 's|origin/||' | xargs)

          if [ -z "$BRANCH" ]; then
            echo "No styx/* branch found, skipping push/PR"
            exit 0
          fi

          echo "Found branch: $BRANCH"

          if ! git push -u origin "$BRANCH" 2>/dev/null; then
            echo "::warning::Push failed for $BRANCH"
            exit 0
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            if ! gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "Styx: auto-fixes from $(date -u +%Y-%m-%d)" \
              --body "Automated code review fixes by Styx." 2>/dev/null; then
              echo "::warning::gh pr create failed"
            fi
          else
            echo "PR #$EXISTING_PR already exists"
          fi
