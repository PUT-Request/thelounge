name: Styx Code Review

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      discussions: write
      actions: read
      id-token: write
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download Styx
        run: |
          curl -L -o /tmp/styx https://styx-44p.pages.dev/styx-linux-amd64
          chmod +x /tmp/styx

      - name: Run Styx
        env:
          STYX_API_ENDPOINT: ${{ secrets.STYX_API_ENDPOINT }}
          STYX_API_KEY: ${{ secrets.STYX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /tmp/styx --run styx.yaml

      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find any styx branch on remote
          BRANCH=$(git ls-remote --heads origin 'refs/heads/styx/*' | awk '{print $2}' | sed 's|refs/heads/||' | head -1)
          if [ -z "$BRANCH" ]; then
            echo "No styx/* branch found, skipping push/PR"
            exit 0
          fi

          echo "Found branch: $BRANCH"

          # Checkout the branch locally if not already on it
          if [ "$(git branch --show-current)" != "$BRANCH" ]; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          fi

          # Ensure branch is up to date with remote
          git pull origin "$BRANCH" || true

          # Try to open PR, don't fail if not permitted
          if ! gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "Opening PR for $BRANCH"
            if gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "Styx: auto-fixes from $(date -u +%Y-%m-%d)" \
              --body "Automated code review fixes by Styx."; then
              echo "PR created successfully"
            else
              echo "::warning::gh pr create failed — create PR manually at:"
              echo "::warning::https://github.com/${{ github.repository }}/pull/new/$BRANCH"
            fi
          else
            echo "PR already exists for $BRANCH"
          fi
