name: Styx Code Review

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Cancel previous run on new push
concurrency:
  group: styx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: "!contains(github.event.head_commit.message, 'Styx:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          # Do not expose a repository write credential to downloaded code or
          # to the model-driven step. The final publishing step authenticates
          # independently after all generated work has completed.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download Styx
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/styx https://styx-44p.pages.dev/styx-linux-amd64
          echo "ad60f44b596f333ba3a662a0e021be14f9505cfd26c5da1a93fdfad2757fd14a  /tmp/styx" \
            | sha256sum --check --strict
          chmod +x /tmp/styx

      - name: Run Styx
        env:
          STYX_API_ENDPOINT: ${{ secrets.STYX_API_ENDPOINT }}
          STYX_API_KEY: ${{ secrets.STYX_API_KEY }}
        run: /tmp/styx --run styx.yaml

      - name: Push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=$(git branch --show-current)

          case "$BRANCH" in
            styx/*) ;;
            *)
              echo "::error::Styx did not leave its changes on a styx/* branch (current: $BRANCH)"
              exit 1
              ;;
          esac

          echo "Found branch: $BRANCH"

          gh auth setup-git
          git push --set-upstream origin "HEAD:refs/heads/$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base "$GITHUB_REF_NAME" \
              --head "$BRANCH" \
              --title "Styx: auto-fixes from $(date -u +%Y-%m-%d)" \
              --body "Automated code review fixes by Styx. Review and test every change before merging."
          else
            echo "PR #$EXISTING_PR already exists"
          fi
