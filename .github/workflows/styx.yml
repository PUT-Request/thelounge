name: Styx Code Review

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      discussions: write
      actions: read
      id-token: write
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Styx
        run: |
          curl -L -o styx https://styx-44p.pages.dev/styx-linux-amd64
          chmod +x styx

      - name: Run Styx
        env:
          STYX_API_ENDPOINT: ${{ secrets.STYX_API_ENDPOINT }}
          STYX_API_KEY: ${{ secrets.STYX_API_KEY }}
        run: ./styx --run styx.yaml
