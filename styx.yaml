# Styx task configuration
prompt: |
  Review all TypeScript files in this repository for common issues:
  - Unhandled errors
  - Race conditions
  - Missing documentation on exported functions
  
  For each issue found, create a fix on a new branch.
  
  After making changes, verify each commit by running:
  - git status
  - git diff
  - git log --oneline -5
  
  In your final message, return the EXACT word-for-word output of each command you ran (git status, git diff, git log, etc.). Do not summarize or paraphrase — paste the raw terminal output.

mode: read_write

api_endpoint: $STYX_API_ENDPOINT
api_key: $STYX_API_KEY
model: big-pickle
max_context: 200000

max_working_time: 30m
