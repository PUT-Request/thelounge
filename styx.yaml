# Styx task configuration
prompt: |
    Review all TypeScript files in this repository for common issues:
    - Unhandled errors
    - Race conditions
    - Missing documentation on exported functions

    Create ONE branch named `styx/fixes-<unix-timestamp>` off the latest `master`.
    Make all fixes on that single branch, committing as you go.

    IMPORTANT RULES:
    - Do NOT commit the `styx` binary
    - Do NOT create multiple branches — everything goes on one branch

    After all fixes are committed, verify by running:
    - git status
    - git diff
    - git log --oneline -5
    - git push -u origin $(git branch --show-current)
    - git ls-remote --heads origin

    In your final message, return the EXACT word-for-word output of each command you ran. Do not summarize or paraphrase — paste the raw terminal output.

mode: read_write

api_endpoint: $STYX_API_ENDPOINT
api_key: $STYX_API_KEY
model: meta/muse-spark-1.3-contributor
max_context: 200000

max_working_time: 50m
